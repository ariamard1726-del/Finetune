# مدل پایه فارسی
base_model: "alphaedge-ai/Qwen3-1.7B-fas-32768"

# طول بیشینه (نمونه‌های جدید ~800 توکن میانگین، ~1500 حداکثر)
max_length: 2048

per_device_batch_size: 2
gradient_accumulation: 4

# LoRA (هماهنگ با آداپتور موجود r=8)
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05

# برای LoRA مقدار مناسب
learning_rate: 1.0e-4
epochs: 1

# سقف گام در هر اجرا
max_steps_per_chunk: 30

# سقف زمان آموزش به دقیقه
max_minutes: 270

adapter_path: "models/lora_adapter"
val_file: "data/val.jsonl"
val_samples: 10

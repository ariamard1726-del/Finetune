name: Persian Legal LLM Fine-tuning

on:
  push:
    branches:
      - main
    paths:
      - 'data/shards/**'
  workflow_dispatch: # این خط اجازه می‌دهد اکشن را دستی هم اجرا کنید

jobs:
  train:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Training
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }} # اینجا توکن به عنوان متغیر محیطی به پایتون داده می‌شود
      run: |
        python src/train.py
        
    - name: Commit and Push LoRA Adapters
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto: Update fine-tuned LoRA weights"
        file_pattern: 'models/lora_adapter/*'

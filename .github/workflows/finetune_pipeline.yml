name: Persian Legal LLM Fine-tuning

on:
  push:
    branches:
      - main
    paths:
      - 'data/shards/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # حداکثر زمان 5 ساعت و 50 دقیقه
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Training
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }} 
      run: |
        python src/train.py
        
    - name: Remove Trained Chunk
      run: |
        FIRST_CHUNK=$(ls data/shards/legal_chunk_*.jsonl | sort -V | head -n 1)
        if [ -n "$FIRST_CHUNK" ]; then
          rm "$FIRST_CHUNK"
          echo "✅ Deleted trained chunk: $FIRST_CHUNK"
        fi
        
    - name: Commit and Push Updates
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto: Trained on next legal chunk and updated LoRA"
        file_pattern: 'models/lora_adapter/* data/shards/*'

name: Persian Legal LLM Fine-tuning

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finetune-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt

    - name: Cache base model
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: hf-qwen3-1.7b-fas

    - name: Run Training
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        python src/train.py

    - name: Verify this run saved a result
      run: |
        python src/verify_run.py

    - name: Commit and Push Updates
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto: trained next chunk and updated LoRA"
        file_pattern: 'models/lora_adapter data/shards data/done'
